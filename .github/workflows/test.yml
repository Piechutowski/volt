name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: go build ./... ./lsp/... ./cmd/volt/...
      - run: go vet ./... ./lsp/... ./cmd/volt/...
      - run: go test ./... ./lsp/... ./cmd/volt/...
      - run: go test -race ./lang/... ./lsp/...
      - run: test -z "$(gofmt -l . | grep -v zed-extension)"
