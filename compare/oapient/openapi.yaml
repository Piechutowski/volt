openapi: 3.0.3
info:
  title: Blog
  version: 1.0.0
  description: The comparison's blog contract, served by oapi-codegen and Ent.
security:
  - member: []
paths:
  /posts:
    post:
      operationId: CreatePost
      summary: Store a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPost"
      responses:
        "201":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      operationId: GetFeed
      summary: Page the published posts, newest first.
      parameters:
        - name: tag
          in: query
          schema:
            type: string
        - name: after
          in: query
          description: The next cursor of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: One page of the feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /posts/{id}:
    parameters:
      - $ref: "#/components/parameters/PostID"
    get:
      operationId: GetPost
      summary: Read a post; a draft is its author's alone.
      responses:
        "200":
          description: The post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: EditPost
      summary: Change the title or body of the author's draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostEdit"
      responses:
        "200":
          description: The edited post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /posts/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/PostID"
    post:
      operationId: PublishPost
      summary: Publish the author's draft and audit it in one transaction.
      responses:
        "200":
          description: The published post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /posts/{id}/audit:
    parameters:
      - $ref: "#/components/parameters/PostID"
    get:
      operationId: GetAudit
      summary: List a post's audit entries to its author.
      responses:
        "200":
          description: The audit entries, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Audit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/PostID"
    post:
      operationId: CreateComment
      summary: Comment on a published post, at most 3 per member and post in an hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewComment"
      responses:
        "201":
          description: The comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      operationId: ListComments
      summary: List a post's comments, oldest first.
      responses:
        "200":
          description: The comments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{id}/comments/{cid}:
    parameters:
      - $ref: "#/components/parameters/PostID"
      - name: cid
        in: path
        required: true
        schema:
          type: integer
    delete:
      operationId: DeleteComment
      summary: Delete a comment; only its author or the post's may.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/stats:
    get:
      operationId: GetStats
      summary: Count the member's drafts, published posts and comments received.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    member:
      type: apiKey
      in: header
      name: X-User
      description: The id of the member making the request.
  parameters:
    PostID:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    Slug:
      type: string
      pattern: "^[a-z0-9-]{1,60}$"
    Title:
      type: string
      minLength: 1
      maxLength: 200
    Tag:
      type: string
      pattern: "^[a-z0-9-]{1,20}$"
    CommentBody:
      type: string
      minLength: 1
      maxLength: 1000
    NewPost:
      type: object
      required: [slug, title, body]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          $ref: "#/components/schemas/Title"
        body:
          type: string
        tags:
          type: array
          nullable: true
          maxItems: 5
          items:
            $ref: "#/components/schemas/Tag"
    PostEdit:
      type: object
      properties:
        title:
          $ref: "#/components/schemas/Title"
        body:
          type: string
    Post:
      type: object
      required: [id, slug, title, body, state, author_id, tags, published_at, created_at]
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        body:
          type: string
        state:
          type: string
          enum: [draft, published]
        author_id:
          type: integer
        tags:
          type: array
          description: Sorted.
          items:
            type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    FeedItem:
      type: object
      required: [id, slug, title, author_name, published_at, comment_count]
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        author_name:
          type: string
        published_at:
          type: string
          format: date-time
        comment_count:
          type: integer
    Feed:
      type: object
      required: [posts, next]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        next:
          type: string
          description: The cursor of the next page, empty on the last.
    NewComment:
      type: object
      required: [body]
      properties:
        body:
          $ref: "#/components/schemas/CommentBody"
    Comment:
      type: object
      required: [id, post_id, member_id, body, created_at]
      properties:
        id:
          type: integer
        post_id:
          type: integer
        member_id:
          type: integer
        body:
          type: string
        created_at:
          type: string
          format: date-time
    Audit:
      type: object
      required: [action, member_id, at]
      properties:
        action:
          type: string
        member_id:
          type: integer
        at:
          type: string
          format: date-time
    Stats:
      type: object
      required: [drafts, published, comments_received]
      properties:
        drafts:
          type: integer
        published:
          type: integer
        comments_received:
          type: integer
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        field:
          type: string
          description: The request field refused, when there is one.
  responses:
    BadRequest:
      description: The body is not JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: X-User is missing or names no member.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The member may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource is not in a state that allows this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: A value is refused; field names it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many comments in an hour.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
